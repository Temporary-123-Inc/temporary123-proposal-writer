name: Validate portable skill

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate repository and runtime
        run: python tools/manage.py validate
      - name: Test management tooling
        run: python -m unittest discover -s tests -v
      - name: Build portable ZIP
        run: python tools/manage.py package --output dist/temporary123-proposal-writer.zip
